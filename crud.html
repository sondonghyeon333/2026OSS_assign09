<form id="gameForm">
  <input id="title" placeholder="게임 제목" required>
  <input id="genre" placeholder="장르" required>
  <input id="platform" placeholder="플랫폼" required>
  <input id="price" type="number" min="0" required>
  <input id="rating" type="number"
         min="0" max="5" step="0.1" required>
  <button id="saveButton">게임 추가</button>
</form>
